# '줍줍 분석' 원자료 받기 (2026-11-22) — site/tools/analysis_data.py → site/data/analysis/raw.json
# 저장소 비밀 DATA_GO_KR_KEY 필요(scores.yml 과 같은 키). 스크립트가 바뀌어 푸시되면 바로 한 번, 그 뒤 매주 월요일 06:17 KST.
name: analysis-data
on:
  push:
    branches: [main]
    paths: [site/tools/analysis_data.py, .github/workflows/analysis-data.yml]
  schedule:
    - cron: "17 21 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analysis-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            site/tools/analysis_data.py
            site/data/analysis
      - name: fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 site/tools/analysis_data.py --since 2026-01-01
      - name: commit
        run: |
          git config user.name "jupjup-bot"
          git config user.email "bot@jupjupalarm.com"
          git add site/data/analysis/raw.json
          git diff --cached --quiet && exit 0
          git commit -m "data: 줍줍 분석 원자료(청약홈)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
