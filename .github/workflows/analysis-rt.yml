# 줍줍 분석 2차 원자료 (2026-11-22) — site/tools/analysis_rt.py → site/data/analysis/rt_*.json.gz·mdl.json·apt_hist.json
# 비밀 DATA_GO_KR_KEY. 스크립트가 바뀌어 푸시되면 한 번 (손으로는 workflow_dispatch). 매매·전월세 수도권 × 2025-01~ 이라 1시간쯤 걸림.
name: analysis-rt
on:
  push:
    branches: [main]
    paths: [site/tools/analysis_rt.py, .github/workflows/analysis-rt.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: analysis-rt
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            site/tools/analysis_rt.py
            site/data/lawd.json
            site/data/analysis
      - name: fetch
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 site/tools/analysis_rt.py
      - name: commit
        run: |
          git config user.name "jupjup-bot"
          git config user.email "bot@jupjupalarm.com"
          git add site/data/analysis/rt_trade.json.gz site/data/analysis/rt_rent.json.gz site/data/analysis/mdl.json site/data/analysis/apt_hist.json
          git diff --cached --quiet && exit 0
          git commit -m "data: 줍줍 분석 실거래·분양가 원자료"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
