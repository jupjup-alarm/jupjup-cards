body{margin:0;width:1080px;height:1350px;overflow:hidden}

 font-family:'Noto Sans KR',sans-serif;color:#0F1E3D;word-break:keep-all;overflow-wrap:break-word}

.ww{font-size:28px;font-weight:700}
